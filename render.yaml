services:
  - type: web
    name: tolvano-wcc
    runtime: static
    rootDir: wcc-app
    buildCommand: "true"
    staticPublishPath: "."
    headers:
      - path: /*
        name: Cache-Control
        value: "no-store, max-age=0"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://tldrrrnwbmgbfnxyomwn.supabase.co; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'none'; font-src 'none'"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: "same-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
